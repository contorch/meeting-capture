name: release-sysaudio

# Builds a universal (arm64 + x86_64) sysaudio, signs it with the Developer ID
# certificate from repo secrets, and attaches it to the release for tag pushes.
# The stable Developer ID signature is what lets macOS TCC permission grants
# survive upgrades (ad-hoc builds are cdhash-pinned and break on every rebuild).
#
# Secrets required:
#   MACOS_CERT_P12       — base64 of the Developer ID Application .p12 (key + cert + G2 chain)
#   MACOS_CERT_PASSWORD  — the .p12 passphrase

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign:
    # `sysaudio transcribe` (on-device SpeechAnalyzer) needs the macOS 26 SDK,
    # so the build needs Xcode 26+. macOS 26 also lets the smoke test run the
    # real macOS 26 transcribe code path instead of its "needs macOS 26" stub.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Pinned. Keep it the same as the `sysaudio` job in tests.yml (the PR-time
      # build check), so a PR builds with exactly what a release ships.
      XCODE_APP: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_APP"
          xcrun --sdk macosx --show-sdk-version

      - name: Import signing identity into a throwaway keychain
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$CERT_P12" | base64 -d > /tmp/cert.p12
          security create-keychain -p ci-tmp ci.keychain
          security unlock-keychain -p ci-tmp ci.keychain
          security import /tmp/cert.p12 -k ci.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-tmp ci.keychain
          security list-keychains -d user -s ci.keychain login.keychain
          rm /tmp/cert.p12

      # Asserts SDK >= 26, retries the flaky swift build, fails unless the
      # binary is universal and both slices link Speech.framework, and leaves
      # ./sysaudio at the repo root.
      - name: Build universal sysaudio
        run: .github/scripts/build-sysaudio.sh

      - name: Sign with Developer ID (hardened runtime + timestamp)
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning ci.keychain | grep -oE '[A-F0-9]{40}' | head -1)
          [ -n "$IDENTITY" ] || { echo "no signing identity found"; exit 1; }
          # --entitlements is CRITICAL: with the hardened runtime on, mic access
          # needs com.apple.security.device.audio-input or macOS denies it
          # silently and every brew user gets system-audio-only transcripts.
          codesign --sign "$IDENTITY" --force --timestamp --options runtime \
            --entitlements swift/sysaudio.entitlements sysaudio
          codesign --verify --strict --verbose=2 sysaudio
          codesign -dv sysaudio 2>&1 | grep -E "Identifier|TeamIdentifier|Authority" || true
          echo "== entitlements ==" && codesign -d --entitlements - --xml sysaudio 2>/dev/null | grep -q "audio-input" \
            && echo "audio-input entitlement present" \
            || { echo "FATAL: audio-input entitlement missing after signing"; exit 1; }

      # On the signed binary. Never captures: it checks the capture CLI still
      # parses as before and that `sysaudio transcribe --probe` runs and exits
      # 0, 69 or 75 (plus the rest of the transcribe exit-code contract).
      - name: Smoke-test the signed binary (no capture)
        run: .github/scripts/sysaudio-smoke.sh ./sysaudio

      - name: Package
        run: |
          set -euo pipefail
          tar -czf sysaudio-universal-macos.tar.gz sysaudio
          shasum -a 256 sysaudio-universal-macos.tar.gz | tee sysaudio-universal-macos.tar.gz.sha256

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sysaudio-universal-macos
          path: |
            sysaudio-universal-macos.tar.gz
            sysaudio-universal-macos.tar.gz.sha256

      - name: Attach to release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Signed universal sysaudio attached." 2>/dev/null || true
          gh release upload "$TAG" sysaudio-universal-macos.tar.gz sysaudio-universal-macos.tar.gz.sha256 --repo "$GITHUB_REPOSITORY" --clobber
