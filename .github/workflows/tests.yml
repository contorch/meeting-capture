name: tests

# The unit suite, on every PR and push to main. Until this existed the tests
# only ever ran on a developer's machine — the only workflow was the tag-
# triggered release build.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install (with the line-in and app extras, so their real imports are exercised)
        run: python -m pip install -q -e '.[dev,linein,app]'
      - name: pytest
        run: python -m pytest -q tests
      - name: channel guard fixtures are pipeline-monitor's, at the pinned commit
        run: |
          set -euo pipefail
          pin=tests/fixtures/channel_guard/PIN
          commit=$(awk '/^commit /{print $2}' "$pin")
          d=$(mktemp -d)
          for f in $(awk 'NF==2 && $2 ~ /\.json$/ {print $2}' "$pin"); do
            curl -fsSL "https://raw.githubusercontent.com/contorch/pipeline-monitor/$commit/contract/channel_guard/$f" -o "$d/$f"
          done
          (cd "$d" && grep -v '^#\|^commit' "$GITHUB_WORKSPACE/$pin" | shasum -a 256 -c -)
      - name: line-in extra imports and lists devices on a real macOS runner
        run: |
          python - <<'PY'
          from meeting_capture import linein
          devs = linein.list_input_devices()   # real PortAudio, no hardware assumed
          print(f"sounddevice OK; {len(devs)} input device(s) on the runner")
          PY
      - name: app extra — the real SMAppService API the registrar calls (read-only, nothing registered)
        run: |
          python - <<'PY'
          from meeting_capture import registrar
          assert registrar.available()
          svc = registrar._service("com.contorch.labtest.ci-nonexistent")
          assert hasattr(svc, "registerAndReturnError_") and hasattr(svc, "unregisterAndReturnError_")
          print("SMAppService status of a label nobody registered:", registrar.status("com.contorch.labtest.ci-nonexistent"))
          PY

  # Builds sysaudio with the release toolchain on every PR. Swift breakage,
  # including the macOS 26-only `transcribe` code, then shows up here instead
  # of at tag time in release-sysaudio.yml.
  sysaudio:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Keep it the same as XCODE_APP in release-sysaudio.yml.
      XCODE_APP: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_APP"
          xcrun --sdk macosx --show-sdk-version
      # Pure logic only (no Speech calls, no capture). Retried like the build
      # script's `swift build`, which can SIGABRT (exit 134) on this runner.
      - name: Swift unit tests (swift test)
        working-directory: swift
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            swift test && exit 0
            echo "swift test attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1
      - name: Build universal sysaudio (the release build script)
        run: .github/scripts/build-sysaudio.sh
      - name: Sign ad-hoc with the release's hardened runtime + entitlements
        run: codesign --force --sign - --options runtime --entitlements swift/sysaudio.entitlements sysaudio
      # Never captures. --try-install downloads and/or reserves the en-US model
      # when this binary can't use it yet, so the real transcription path runs
      # too (best effort).
      - name: Smoke-test (capture CLI parsing, transcribe exit-code contract)
        run: .github/scripts/sysaudio-smoke.sh ./sysaudio --try-install
