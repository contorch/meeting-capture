name: tests

# The unit suite, on every PR and push to main. Until this existed the tests
# only ever ran on a developer's machine — the only workflow was the tag-
# triggered release build.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install (with the line-in extra, so its real imports are exercised)
        run: python -m pip install -q -e '.[dev,linein]'
      - name: pytest
        run: python -m pytest -q tests
      - name: line-in extra imports and lists devices on a real macOS runner
        run: |
          python - <<'PY'
          from meeting_capture import linein
          devs = linein.list_input_devices()   # real PortAudio, no hardware assumed
          print(f"sounddevice OK; {len(devs)} input device(s) on the runner")
          PY

  # Builds sysaudio with the release toolchain on every PR. Swift breakage,
  # including the macOS 26-only `transcribe` code, then shows up here instead
  # of at tag time in release-sysaudio.yml.
  sysaudio:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Keep it the same as XCODE_APP in release-sysaudio.yml.
      XCODE_APP: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_APP"
          xcrun --sdk macosx --show-sdk-version
      - name: Build universal sysaudio (the release build script)
        run: .github/scripts/build-sysaudio.sh
      - name: Sign ad-hoc with the release's hardened runtime + entitlements
        run: codesign --force --sign - --options runtime --entitlements swift/sysaudio.entitlements sysaudio
      # Never captures. --try-install downloads the en-US model when the
      # runner lacks it, so the real transcription path runs too (best effort).
      - name: Smoke-test (capture CLI parsing, transcribe exit-code contract)
        run: .github/scripts/sysaudio-smoke.sh ./sysaudio --try-install
